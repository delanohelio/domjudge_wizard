    <!-- Injeção dinâmica de variáveis de ambiente do backend com suporte a subrota (BASE_PATH) -->
    <script>
      (function() {
        var path = window.location.pathname || "";
        var knownStandalone = ["/cadastro", "/register", "/criar-conta", "/trocar-senha", "/change-password"];
        var basePath = "";
        for (var i = 0; i < knownStandalone.length; i++) {
          if (path.endsWith(knownStandalone[i])) {
            basePath = path.substring(0, path.length - knownStandalone[i].length);
            break;
          }
        }
        if (!basePath && path && path !== "/") {
          basePath = path.replace(/\/+$/, "");
        }
        window.__DETECTED_BASE_PATH__ = basePath;
        var configUrl = (basePath ? basePath : "") + "/config.js";
        document.write('<script src="' + configUrl + '"><\\/script>');
      })();
    </script>
