services:
  domjudge-wizard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: 7070
    container_name: domjudge_wizard
    restart: unless-stopped
    ports:
      - "${PORT:-7070}:7070"
    environment:
      - PORT=7070
      - DOMJUDGE_API_URL=${DOMJUDGE_API_URL:-https://coderunner.cin.ufpe.br/api/v4}
      - DOMJUDGE_ADMIN_USER=${DOMJUDGE_ADMIN_USER:-admin}
      - DOMJUDGE_ADMIN_PASSWORD=${DOMJUDGE_ADMIN_PASSWORD:-}
      - WIZARD_ADMIN_LABEL=${WIZARD_ADMIN_LABEL:-admin}
      - SESSION_EXPIRATION_DAYS=${SESSION_EXPIRATION_DAYS:-7}
      - ENABLE_DEMO_MODE=${ENABLE_DEMO_MODE:-true}
      - BASE_PATH=${BASE_PATH:-}
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
