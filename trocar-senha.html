<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alteração de Senha - DOMjudge</title>
    <meta
      name="description"
      content="Página individual e segura para alteração de senha de usuários do DOMjudge."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="trocar-senha.css" />
  </head>
  <body>
    <div class="bg-grid"></div>

    <main class="password-wrapper">
      <div class="password-card">
        <!-- Cabeçalho do Card -->
        <header class="card-header">
          <div class="brand-icon">
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h1 class="card-title">Alteração de Senha</h1>
          <p class="card-subtitle">
            Atualize a senha de acesso da sua conta de usuário no DOMjudge.
          </p>
        </header>

        <!-- Caixa de Mensagem de Feedback (Sucesso / Erro) -->
        <div id="feedbackAlert" class="feedback-alert" role="alert" hidden>
          <div class="feedback-icon" id="feedbackIcon" aria-hidden="true"></div>
          <div class="feedback-content">
            <h2 class="feedback-title" id="feedbackTitle"></h2>
            <p class="feedback-message" id="feedbackMessage"></p>
          </div>
          <button
            type="button"
            class="feedback-close"
            id="feedbackCloseBtn"
            aria-label="Fechar notificação"
          >
            &times;
          </button>
        </div>

        <!-- Formulário de Alteração de Senha -->
        <form id="changePasswordForm" class="password-form" novalidate>
          <!-- Campo 1: Usuário / Login -->
          <div class="form-field">
            <label for="usernameInput" class="field-label">
              <span>Usuário / Login</span>
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input
                id="usernameInput"
                name="username"
                type="text"
                class="form-input"
                required
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                placeholder="Ex: time01 ou aluno.silva"
              />
            </div>
          </div>

          <!-- Campo 2: Senha Anterior -->
          <div class="form-field">
            <label for="currentPasswordInput" class="field-label">
              <span>Senha Anterior (Atual)</span>
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="m21 2-2 2m-1.5 1.5L14 9l-1.5-1.5L11 9l-1.5-1.5L8 9"
                  ></path>
                  <circle cx="7.5" cy="16.5" r="4.5"></circle>
                  <path d="m10.5 13.5 10-10"></path>
                </svg>
              </span>
              <input
                id="currentPasswordInput"
                name="currentPassword"
                type="password"
                class="form-input"
                required
                autocomplete="current-password"
                placeholder="Digite sua senha atual"
              />
              <button
                type="button"
                class="toggle-visibility-btn"
                data-target="currentPasswordInput"
                aria-label="Mostrar senha anterior"
                title="Mostrar senha anterior"
              >
                <svg
                  class="eye-open"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg
                  class="eye-closed"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  hidden
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  ></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Campo 3: Nova Senha -->
          <div class="form-field">
            <label for="newPasswordInput" class="field-label">
              <span>Nova Senha</span>
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input
                id="newPasswordInput"
                name="newPassword"
                type="password"
                class="form-input"
                required
                minlength="10"
                autocomplete="new-password"
                placeholder="Mínimo de 10 caracteres"
                aria-describedby="passwordRequirements"
              />
              <button
                type="button"
                class="toggle-visibility-btn"
                data-target="newPasswordInput"
                aria-label="Mostrar nova senha"
                title="Mostrar nova senha"
              >
                <svg
                  class="eye-open"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg
                  class="eye-closed"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  hidden
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  ></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <!-- Barra de Força da Senha -->
            <div class="strength-track" aria-hidden="true">
              <div id="strengthFill" class="strength-fill"></div>
            </div>
          </div>

          <!-- Campo 4: Confirmação da Nova Senha -->
          <div class="form-field">
            <label for="confirmPasswordInput" class="field-label">
              <span>Confirmar Nova Senha</span>
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                  <path d="m9 12 2 2 4-4"></path>
                </svg>
              </span>
              <input
                id="confirmPasswordInput"
                name="confirmPassword"
                type="password"
                class="form-input"
                required
                autocomplete="new-password"
                placeholder="Repita a nova senha"
              />
              <button
                type="button"
                class="toggle-visibility-btn"
                data-target="confirmPasswordInput"
                aria-label="Mostrar confirmação de senha"
                title="Mostrar confirmação de senha"
              >
                <svg
                  class="eye-open"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg
                  class="eye-closed"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  hidden
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  ></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Requisitos em Tempo Real -->
          <div id="passwordRequirements" class="requirements-box">
            <span class="requirements-title">Critérios da senha:</span>
            <ul class="requirements-list">
              <li id="ruleLength" class="requirement-item pending">
                <span class="req-icon" aria-hidden="true">
                  <svg
                    class="icon-pending"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <circle cx="12" cy="12" r="9"></circle>
                  </svg>
                  <svg
                    class="icon-valid"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    hidden
                  >
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span>Pelo menos 10 caracteres</span>
              </li>
              <li id="ruleMatch" class="requirement-item pending">
                <span class="req-icon" aria-hidden="true">
                  <svg
                    class="icon-pending"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <circle cx="12" cy="12" r="9"></circle>
                  </svg>
                  <svg
                    class="icon-valid"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    hidden
                  >
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span>As senhas coincidem</span>
              </li>
            </ul>
          </div>

          <!-- Botão de Ação -->
          <button type="submit" id="submitBtn" class="btn-submit">
            <span class="btn-spinner" id="btnSpinner" hidden aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle
                  cx="12"
                  cy="12"
                  r="10"
                  stroke-width="3"
                  stroke-dasharray="32"
                  stroke-linecap="round"
                ></circle>
              </svg>
            </span>
            <span class="btn-text" id="btnText">Salvar Nova Senha</span>
          </button>
        </form>

        <!-- Rodapé Informativo / Segurança -->
        <footer class="card-footer">
          <p class="footer-note">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            Sua nova senha passa a valer imediatamente no DOMjudge após a
            confirmação.
          </p>
        </footer>
      </div>
    </main>

    <script src="trocar-senha.js"></script>
  </body>
</html>
